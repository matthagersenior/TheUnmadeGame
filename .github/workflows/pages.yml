name: Publish The Unmade public site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Scripts/publishing/build_public_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'Scripts/publishing/build_public_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publishing libraries
        run: python -m pip install 'pillow==11.3.0' 'reportlab==4.4.4' 'markdown==3.9'
      - name: Render cinematic film and reading editions
        run: python Scripts/publishing/build_public_site.py
      - name: Validate generated artifacts
        run: python Scripts/publishing/build_public_site.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
