name: Publish The Unmade public site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Scripts/publishing/build_public_site.py'
      - 'Scripts/build_hero_models.py'
      - 'Authoring/world_content_pack.json'
      - 'Scripts/tests/test_distinct_realm_city_layouts.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'Scripts/publishing/build_public_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publishing and actual 3D model libraries
        run: python -m pip install 'reportlab==4.4.4' 'markdown==3.9' 'numpy==2.3.5' 'trimesh==4.11.1' 'pillow==12.3.0'
      - name: Render public reading editions
        run: python Scripts/publishing/build_public_site.py
      - name: Generate real source-authored realm, creature and resident meshes
        run: python Scripts/build_hero_models.py --out-dir site/dist/models
      - name: Validate published artifact and all 50 authentic GLB assets
        run: |
          python Scripts/publishing/build_public_site.py --check
          python Scripts/build_hero_models.py --out-dir site/dist/models --verify-output
          python -m unittest discover -s Scripts/tests -p test_distinct_realm_city_layouts.py -v
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
