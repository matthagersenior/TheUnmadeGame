name: Publish verified source milestone
on:
  workflow_run:
    workflows: [Static checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Unique source milestone tag (for example source-v17)
        required: true
        type: string
concurrency:
  group: source-release-publisher
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  source-prerelease:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Verify main CI and publish annotated source tag and prerelease
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Dispatch only from main');
            const automatic = context.eventName === 'workflow_run';
            const sha = automatic ? context.payload.workflow_run.head_sha : context.sha;
            const tag = automatic ? 'source-v17' : process.env.RELEASE_TAG;
            if (!/^source-v[0-9]+(?:\.[0-9]+)*(?:-[a-z0-9]+)?$/.test(tag)) throw new Error('Invalid source milestone tag');
            const repo = {...context.repo};
            const runs = await github.rest.actions.listWorkflowRuns({...repo, workflow_id: 'static-checks.yml', head_sha: sha, event: 'push'});
            if (!runs.data.workflow_runs.some(run => run.status === 'completed' && run.conclusion === 'success')) throw new Error('This main commit has no successful source CI run');
            if (automatic) {
              try {
                await github.rest.repos.getReleaseByTag({...repo, tag});
                core.info('Initial source milestone already published; future milestones use manual dispatch.');
                return;
              } catch (error) { if (error.status !== 404) throw error; }
            }
            let existing;
            try {
              existing = (await github.rest.git.getRef({...repo, ref: `tags/${tag}`})).data.object;
            } catch (error) { if (error.status !== 404) throw error; }
            if (existing) {
              const target = existing.type === 'tag'
                ? (await github.rest.git.getTag({...repo, tag_sha: existing.sha})).data.object
                : existing;
              if (target.type !== 'commit' || target.sha !== sha) throw new Error('Existing tag points to a different commit; refusing to move it');
              core.info('Resuming publication from the existing verified tag.');
            } else {
              const annotated = await github.rest.git.createTag({...repo, tag, message: `Verified source milestone ${tag}; engine acceptance remains separate.`, object: sha, type: 'commit'});
              await github.rest.git.createRef({...repo, ref: `refs/tags/${tag}`, sha: annotated.data.sha});
            }
            await github.rest.repos.createRelease({...repo, tag_name: tag, name: `The Unmade ${tag} (source prerelease)`, prerelease: true, body: 'Source milestone with passing static and portable-rule CI. No packaged executable or Unreal runtime verification is claimed. See README for current evidence and docs/qa/unreal-ci.md for engine acceptance. Canonical manuscript artifacts are attached to the source CI run; illustrated editions remain separately dated publications.'});
