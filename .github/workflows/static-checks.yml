name: Static checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate repository structure
        run: python Scripts/validate_repo.py
      - name: Enforce lore continuity on gameplay source commits
        run: python Scripts/check_lore_change.py
      - name: Run validator unit tests
        run: python -m unittest discover -s Scripts/tests -v
      - name: Compile and test deterministic C++ fracture rules
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/fracture/fracture_core_test.cpp -o /tmp/unmade-fracture-test
          /tmp/unmade-fracture-test
      - name: Compile and test completely offline NPC decision rules
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/npc/adaptive_npc_test.cpp -o /tmp/unmade-npc-test
          /tmp/unmade-npc-test
      - name: Compile and test offline combat domain
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/combat/combat_rules_test.cpp -o /tmp/unmade-combat-test
          /tmp/unmade-combat-test
      - name: Compile and test offline language discovery
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/lexicon/lexicon_rules_test.cpp -o /tmp/unmade-lexicon-test
          /tmp/unmade-lexicon-test
      - name: Compile and test offline branching story rules
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/story/conflict_rules_test.cpp -o /tmp/unmade-conflict-test
          /tmp/unmade-conflict-test
      - name: Compile and test offline NPC motion
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/npc/npc_motion_test.cpp -o /tmp/unmade-motion-test
          /tmp/unmade-motion-test
      - name: Verify integrated offline gameplay scenario
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/integration/offline_slice_scenario.cpp -o /tmp/unmade-slice-test
          /tmp/unmade-slice-test
      - name: Compile and test offline living-world simulation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/living_world_test.cpp -o /tmp/unmade-living-world-test
          /tmp/unmade-living-world-test
      - name: Verify three offline settlements and all resident identities
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/settlement_registry_test.cpp -o /tmp/unmade-settlement-test
          /tmp/unmade-settlement-test
      - name: Test optional local village stories
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/regional_tasks_test.cpp -o /tmp/unmade-regional-quest-test
          /tmp/unmade-regional-quest-test
      - name: Compile and test earned gear and consumables
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/items/item_rules_test.cpp -o /tmp/unmade-items-test
          /tmp/unmade-items-test
      - name: Compile and test nine-realm universe atlas
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/world_atlas_test.cpp -o /tmp/unmade-atlas-test
          /tmp/unmade-atlas-test
      - name: Test named boss telegraphs and fracture counterplay
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/combat/boss_rules_test.cpp -o /tmp/unmade-boss-test
          /tmp/unmade-boss-test
      - name: Test village economies, professions, and finite crafting
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/items/craft_economy_test.cpp -o /tmp/unmade-economy-test
          /tmp/unmade-economy-test
      - name: Test multi-stage faction stories and irreversible endings
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/faction_chronicle_test.cpp -o /tmp/unmade-faction-test
          /tmp/unmade-faction-test
      - name: Test two expanded frontier realms, characters, and stories
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/frontier_realms_test.cpp -o /tmp/unmade-frontier-test
          /tmp/unmade-frontier-test
      - name: Compile and test ten signature RPG mechanics and questlines
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/tenfold_chronicle_test.cpp -o /tmp/unmade-tenfold-test
          /tmp/unmade-tenfold-test
      - name: Test six earned cross-discipline confluence challenges
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/confluence_rules_test.cpp -o /tmp/unmade-confluence-test
          /tmp/unmade-confluence-test
      - name: Verify community consequences are earned, distinct and replay-safe
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/community_consequences_test.cpp -o /tmp/unmade-community-test
          /tmp/unmade-community-test
      - name: Test Bellwold aftermath investigation, two routes and durable outcomes
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/bellwold_afterlight_test.cpp -o /tmp/unmade-afterlight-test
          /tmp/unmade-afterlight-test
      - name: Verify all nine realm aftermath arcs, two decisions and durable continuity
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/realm_aftermath_test.cpp -o /tmp/unmade-realm-aftermath
          /tmp/unmade-realm-aftermath

      - name: Test frontier hazard telegraphs, safe routes and remedy
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/frontier_hazard_test.cpp -o /tmp/unmade-frontier-hazards
          /tmp/unmade-frontier-hazards

      - name: Test offline character identity, profile validation and snapshots
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/player/character_identity_test.cpp -o /tmp/unmade-identity
          /tmp/unmade-identity

      - name: Verify guarded irreversible story choices before effects
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/story/commitment_rules_test.cpp -o /tmp/unmade-commitment-test
          /tmp/unmade-commitment-test

      - name: Verify six later realm adventures and durable, non-farmable return chapters
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/later_realm_journey_test.cpp -o /tmp/unmade-later-realms
          /tmp/unmade-later-realms

      - name: Test six fair environmental hazards, safe lanes and strain saturation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/later_hazard_test.cpp -o /tmp/unmade-later-hazards
          /tmp/unmade-later-hazards
