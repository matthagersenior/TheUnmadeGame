name: Static checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Test integration rewards, unified equipment and bounded weapon contact
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/player_experience_test.cpp -o /tmp/unmade-experience
          /tmp/unmade-experience
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/items/unified_loadout_test.cpp -o /tmp/unmade-loadout
          /tmp/unmade-loadout
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/combat/contact_window_test.cpp -o /tmp/unmade-contact
          /tmp/unmade-contact
      - name: Test realm identity mechanisms and signature attack footprints
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/world_identity_test.cpp -o /tmp/unmade-world-identity
          /tmp/unmade-world-identity
      - name: Test realm depth, combat style and defense receipts
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/adventure_depth_test.cpp -o /tmp/unmade-depth
          /tmp/unmade-depth
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/combat/combat_style_test.cpp -o /tmp/unmade-style
          /tmp/unmade-style
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/combat/defense_receipt_test.cpp -o /tmp/unmade-defense-receipts
          /tmp/unmade-defense-receipts
      - name: Parse first-PC PowerShell entry points
        shell: pwsh
        run: |
          $paths = @(
            "Scripts/first_pc_build_and_test.ps1",
            "Scripts/first_pc_quickstart.ps1",
            "Scripts/check_unreal_host.ps1",
            "Scripts/run_ue_tests.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}:$($_.Extent.StartLineNumber): $($_.Message)" }
              exit 1
            }
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate authored wings, lexical C++ and editor contact handoff
        run: |
          python Scripts/build_player_experience.py --check
          python Scripts/validate_cpp_literals.py
          python Scripts/unreal_editor/install_combat_events.py
      - name: Validate authored personal stories and nine exploration identities
        run: python Scripts/build_adventure_depth.py --check
      - name: Check identity registry and original sound library
        run: |
          python Scripts/build_world_identity.py --check
          python Scripts/build_identity_audio.py --out /tmp/unmade-identity-audio
      - name: Check canonical nine-realm authoring master and Unreal import outputs
        run: python Scripts/build_world_content.py --check
      - name: Validate cinematic and realm production source against Unreal CSVs
        run: python Scripts/build_cinematic_handoff.py --check

      - name: Check every main quest branch, 82 returning people and Unreal staging manifest
        run: python Scripts/build_story_scene_handoff.py --check

      - name: Validate lived-universe clues, routines, side stories and 90 Unreal work orders
        run: python Scripts/validate_lived_universe.py --check

      - name: Validate 56-scene full-universe cinema and stereo audio acceptance contract
        run: python Scripts/validate_directors_cut.py

      - name: Enforce ten-volume storyworld, stable cast/cities and unanswered mystery ledger
        run: python Scripts/validate_transmedia_storyworld.py --check

      - name: Validate one-click first PC Unreal production content and guarded Editor plans
        run: |
          python Scripts/prepare_unreal_authoring.py --check
          python Scripts/unreal_editor/first_pc_editor_batch.py
          python Scripts/unreal_editor/stage_lived_world_manifest.py

      - name: Validate all 11 city build kits and 402 production-linked proxy actors
        run: |
          python Scripts/build_city_assembly.py --check
          python Scripts/unreal_editor/stage_city_assembly.py
      - name: Validate all eleven Remembered Road adventures and every registered person
        run: python Scripts/build_remembered_roads.py --check
      - name: Test finite deliveries, authored performances and bounded creature routines
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/remembered_roads_test.cpp -o /tmp/remembered_roads_test
          /tmp/remembered_roads_test
      - name: Validate nine combat exploration adventures and 18 new settlements
        run: python Scripts/build_frontier_adventures.py --check
      - name: Test branches, persistent rewards, boss patterns and save rejection
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/expedition_test.cpp -o /tmp/expedition_test
          /tmp/expedition_test
      - name: Validate and build canonical manuscript
        run: |
          python Scripts/build_bible.py --check
          python Scripts/build_bible.py
      - name: Retain canonical manuscript and hashes
        uses: actions/upload-artifact@v4
        with:
          name: canonical-manuscript-${{ github.sha }}
          path: PublicationBuild/
          if-no-files-found: error
      - name: Validate documentation and binary admission
        run: python Scripts/validate_hygiene.py
      - name: Test release publication and interrupted-run recovery
        run: node Scripts/tests/source_release_test.cjs
      - name: Check source-backed items, skills, bosses, quest rewards and persistent aftermath
        run: python Scripts/validate_dependency_ledger.py
      - name: Validate repository structure
        run: python Scripts/validate_repo.py
      - name: Enforce lore continuity on gameplay source commits
        run: python Scripts/check_lore_change.py
      - name: Generate and validate 35 real stereo Unpaid Shift Foley assets
        run: |
          python Scripts/build_unpaid_shift_audio.py --check
          python Scripts/unreal_editor/import_unpaid_shift_audio.py
      - name: Validate original Cinderhold signal and positional Foley import plan
        run: |
          python Scripts/build_cinderhold_audio.py --check
          python Scripts/unreal_editor/import_cinderhold_audio.py
      - name: Test persistent observation, mastered combinations and Atlas reward
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I Source/TheUnmadeGame/Public Tests/world/ability_study_test.cpp -o /tmp/unmade-study
          /tmp/unmade-study
      - name: Test Codex-owned world realms and attunement-gated passages
