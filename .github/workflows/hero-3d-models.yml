name: Generate actual The Unmade 3D meshes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Scripts/build_hero_models.py
      - Scripts/tests/test_hero_model_assets.py
      - Scripts/tests/test_distinct_realm_city_layouts.py
      - .github/workflows/hero-3d-models.yml
      - Authoring/world_content_pack.json
  pull_request:
    paths:
      - Scripts/build_hero_models.py
      - Scripts/tests/test_hero_model_assets.py
      - Scripts/tests/test_distinct_realm_city_layouts.py
      - .github/workflows/hero-3d-models.yml
      - Authoring/world_content_pack.json
permissions:
  contents: read
jobs:
  generate-real-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible offline mesh tools
        run: python -m pip install 'numpy==2.3.5' 'trimesh==4.11.1' 'Pillow==12.3.0'
      - name: Build 50 different canonical meshes including eleven settlements (GLB, not mockups)
        run: python Scripts/build_hero_models.py --out-dir Build/UnmadeHeroModels
      - name: Verify every byte against the source generator
        run: python Scripts/build_hero_models.py --out-dir Build/UnmadeHeroModels --verify-output
      - name: Verify geometry and canonical identity
        run: python -m unittest discover -s Scripts/tests -p test_hero_model_assets.py -v
      - name: Verify nine distinct realms and eleven distinct city layouts
        run: python -m unittest discover -s Scripts/tests -p test_distinct_realm_city_layouts.py -v
      - name: Upload 50 source-geometry reference meshes as one artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheUnmade-50-Creature-NPC-Realm-City-GLB
          path: Build/UnmadeHeroModels/
          if-no-files-found: error
          retention-days: 30
