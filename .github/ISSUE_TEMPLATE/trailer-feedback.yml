name: Cinematic direction feedback
description: Share specific, public feedback on the proposed cinematic direction for The Unmade.
title: "[Film direction] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking a look at The Unmade. The finished cinematic has not yet been published; this feedback relates to the **director's treatment, not footage or gameplay**. Feedback submissions are public; please do not include personal contact details or story spoilers.
  - type: dropdown
    id: feeling
    attributes:
      label: What was your first impression?
      options:
        - Intrigued — I want to know more
        - Moved by the world and atmosphere
        - Visually interesting but unclear
        - I expected gameplay footage
        - Something else
    validations:
      required: true
  - type: textarea
    id: memorable
    attributes:
      label: Which proposed moment interests you most?
      placeholder: A particular proposed scene, character moment, visual effect or reaction...
    validations:
      required: true
  - type: textarea
    id: unclear
    attributes:
      label: What could be clearer or better?
      placeholder: Shot priorities, character action, tone, accessibility, emotional arc...
  - type: dropdown
    id: explore
    attributes:
      label: What would you most like to see next?
      options:
        - Actual in-engine gameplay after it's verified
        - Combat and ability demonstrations
        - Exploration of a particular realm
        - Choices, characters and consequences
        - Development progress updates
